<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#01030a"><meta name="description" content="VESTIGE — living light in an immersive forest.">
  <link rel="icon" href="data:,"><link rel="stylesheet" href="/forest-loading.css"><title>VESTIGE</title>
 </head>
 <body style="margin:0;background:#030303">
  <div id="startup-loading" aria-label="VESTIGE">
   <div class="loader-content">
    <p class="loader-kicker" aria-label="A sonic world for the future"><span class="loader-copy-line" aria-hidden="true"><span class="loader-word"><span>A</span></span><span class="loader-word"><span>S</span><span>O</span><span>N</span><span>I</span><span>C</span></span><span class="loader-word"><span>W</span><span>O</span><span>R</span><span>L</span><span>D</span></span></span><span class="loader-copy-line" aria-hidden="true"><span class="loader-word"><span>F</span><span>O</span><span>R</span></span><span class="loader-word"><span>T</span><span>H</span><span>E</span></span><span class="loader-word"><span>F</span><span>U</span><span>T</span><span>U</span><span>R</span><span>E</span></span></span></p>
    <div class="loader-mark">
     <span class="loader-line loader-line-horizontal" aria-hidden="true"></span><span class="loader-line loader-line-vertical" aria-hidden="true"></span>
     <span class="loader-orbit" aria-hidden="true"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="199.5" pathLength="1" /></svg></span>
     <h1 class="loader-title" aria-label="VESTIGE"><span aria-hidden="true">V</span><span aria-hidden="true">E</span><span aria-hidden="true">S</span><span aria-hidden="true">T</span><span aria-hidden="true">I</span><span aria-hidden="true">G</span><span aria-hidden="true">E</span></h1>
    </div>
    <p class="loader-tagline" aria-label="Some sounds should never disappear"><span class="loader-copy-line" aria-hidden="true"><span class="loader-word"><span>S</span><span>O</span><span>M</span><span>E</span></span><span class="loader-word"><span>S</span><span>O</span><span>U</span><span>N</span><span>D</span><span>S</span></span><span class="loader-word"><span>S</span><span>H</span><span>O</span><span>U</span><span>L</span><span>D</span></span></span><span class="loader-copy-line" aria-hidden="true"><span class="loader-word"><span>N</span><span>E</span><span>V</span><span>E</span><span>R</span></span><span class="loader-word"><span>D</span><span>I</span><span>S</span><span>A</span><span>P</span><span>P</span><span>E</span><span>A</span><span>R</span></span></span></p>
    <button class="loader-sound" type="button" aria-pressed="false"><span class="loader-label">SOUND ON</span></button><p class="loader-status" role="status" aria-live="polite"></p>
   </div>
   <div class="loader-error" hidden><p></p><button type="button">Reload</button></div>
  </div>
  <div id="root"></div>
  <script src="/forest-loading.js"></script><script src="/hairline/kernel.js"></script><script type="module" src="/src/main.tsx"></script>
 </body>
</html>
